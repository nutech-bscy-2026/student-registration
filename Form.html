<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Website - Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Student Registration Website</h1>
        <p>National University of Technology</p>
        <nav>
            <a href="index.html">Home</a> |
            <a href="form.html">Register</a>
        </nav>
    </header>

    <main>
        <h2>Registration Form</h2>
        <form action="thanks.html">
            <p>Full Name: <input type="text"></p>
            <p>Roll No: <input type="text"></p>
            <p>Email: <input type="email"></p>
            <p>Gender: 
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
            </p>
            <p>Department:
                <select>
                    <option>Cyber Security</option>
                    <option>Computer Science</option>
                    <option>Artificial Intelligence</option>
                </select>
            </p>
            <p>Address: <textarea></textarea></p>
            <p><input type="submit" value="Register"></p>
        </form>
    </main>

    <footer>
        <p>Student Registration Website | Made by Jaweria Imran</p>
    </footer>
</body>
</html>
